name: Keep repository active

on:
  schedule:
    - cron: "0 0 1 * *" # Runs monthly on the 1st day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive.txt
          git commit -m "Keep scheduled workflows active" || echo "No changes to commit"
          git push
